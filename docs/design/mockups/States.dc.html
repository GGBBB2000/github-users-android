<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>状態パターン</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;family=Noto+Sans+JP:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#6750A4}a:hover{color:#4F378B}
</style>
</helmet>
<div style="width: 1680px; height: 844px; display: flex; gap: 40px; background: transparent; color: #1D1B20; font-family: Roboto, 'Noto Sans JP', sans-serif">

  <section aria-label="初回読み込み中" style="width: 390px; height: 844px; flex-shrink: 0; box-sizing: border-box; background: #FEF7FF; border: 1px solid #CAC4D0; border-radius: 16px; overflow: hidden; display: flex; flex-direction: column">
    <header style="height: 64px; padding: 0 16px; display: flex; align-items: center; flex-shrink: 0">
      <h1 style="margin: 0; font-size: 22px; line-height: 28px; font-weight: 400">GitHub Users</h1>
    </header>
    <div style="margin: 0 16px 12px; height: 56px; border-radius: 28px; background: #ECE6F0; flex-shrink: 0"></div>
    <ul style="list-style: none; margin: 0; padding: 0">
      <sc-for list="{{skeletons}}" as="s" hint-placeholder-count="9">
        <li style="height: 72px; display: flex; align-items: center; gap: 16px; padding: 0 16px">
          <div style="width: 48px; height: 48px; border-radius: 24px; background: #E6E0E9; flex-shrink: 0"></div>
          <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 8px">
            <div style="{{s.lineStyle}}"></div>
            <div style="width: 96px; height: 12px; border-radius: 6px; background: #ECE6F0"></div>
          </div>
        </li>
      </sc-for>
    </ul>
  </section>

  <section aria-label="初回読み込み失敗" style="width: 390px; height: 844px; flex-shrink: 0; box-sizing: border-box; background: #FEF7FF; border: 1px solid #CAC4D0; border-radius: 16px; overflow: hidden; display: flex; flex-direction: column">
    <header style="height: 64px; padding: 0 16px; display: flex; align-items: center; flex-shrink: 0">
      <h1 style="margin: 0; font-size: 22px; line-height: 28px; font-weight: 400">GitHub Users</h1>
    </header>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 0 40px; text-align: center">
      <div style="width: 80px; height: 80px; border-radius: 40px; background: #F9DEDC; color: #8C1D18; display: flex; align-items: center; justify-content: center">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 8.5a15 15 0 0 1 20 0"></path><path d="M5 12a10 10 0 0 1 9-2.6"></path><path d="M8.5 15.5a5 5 0 0 1 4-1.3"></path><path d="M3 3l18 18"></path><circle cx="12" cy="19" r="1"></circle></svg>
      </div>
      <h2 style="margin: 0; font-size: 22px; line-height: 28px; font-weight: 400">読み込めませんでした</h2>
      <p style="margin: 0; font-size: 14px; line-height: 20px; color: #49454F">ネットワーク接続を確認して、もう一度お試しください。</p>
      <button style="height: 40px; padding: 0 24px 0 16px; border: 0; border-radius: 20px; background: #6750A4; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 8px; margin-top: 8px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7"></path><path d="M21 4v5h-5"></path></svg>
        再試行
      </button>
    </div>
  </section>

  <section aria-label="追加読み込み失敗・レート制限" style="width: 390px; height: 844px; flex-shrink: 0; box-sizing: border-box; background: #FEF7FF; border: 1px solid #CAC4D0; border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; position: relative">
    <header style="height: 64px; padding: 0 16px; display: flex; align-items: center; flex-shrink: 0">
      <h1 style="margin: 0; font-size: 22px; line-height: 28px; font-weight: 400">GitHub Users</h1>
    </header>
    <ul style="list-style: none; margin: 0; padding: 0; flex-grow: 1; overflow: hidden">
      <sc-for list="{{users}}" as="u" hint-placeholder-count="8">
        <li style="height: 72px; display: flex; align-items: center; gap: 16px; padding: 0 16px">
          <div style="{{u.avatarStyle}}">{{u.initial}}</div>
          <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 16px; line-height: 24px; font-weight: 500">{{u.login}}</span>
            <span style="font-size: 14px; line-height: 20px; color: #49454F">ID {{u.id}} · User</span>
          </div>
        </li>
      </sc-for>
      <li style="height: 72px; display: flex; align-items: center; justify-content: center; gap: 12px; border-top: 1px solid #CAC4D0">
        <span style="font-size: 14px; color: #49454F">続きを読み込めませんでした</span>
        <button style="height: 40px; padding: 0 16px; border: 1px solid #79747E; border-radius: 20px; background: transparent; color: #6750A4; font: inherit; font-size: 14px; font-weight: 500">再試行</button>
      </li>
    </ul>
    <div role="status" style="position: absolute; left: 16px; right: 16px; bottom: 16px; min-height: 48px; border-radius: 4px; background: #322F35; color: #F5EFF7; display: flex; align-items: center; gap: 8px; padding: 6px 8px 6px 16px; box-sizing: border-box">
      <span style="flex-grow: 1; font-size: 14px; line-height: 20px; padding: 8px 0">API の利用上限に達しました。サインインすると上限が増えます</span>
      <button style="height: 40px; padding: 0 12px; border: 0; background: transparent; color: #D0BCFF; font: inherit; font-size: 14px; font-weight: 500; flex-shrink: 0">サインイン</button>
    </div>
  </section>

  <section aria-label="初回読み込み失敗・レート制限（未ログイン）" style="width: 390px; height: 844px; flex-shrink: 0; box-sizing: border-box; background: #FEF7FF; border: 1px solid #CAC4D0; border-radius: 16px; overflow: hidden; display: flex; flex-direction: column">
    <header style="height: 64px; padding: 0 16px; display: flex; align-items: center; flex-shrink: 0">
      <h1 style="margin: 0; font-size: 22px; line-height: 28px; font-weight: 400">GitHub Users</h1>
    </header>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 0 32px; text-align: center">
      <div style="width: 80px; height: 80px; border-radius: 40px; background: #F9DEDC; color: #8C1D18; display: flex; align-items: center; justify-content: center">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12M6 21h12"></path><path d="M7 3v3a5 5 0 0 0 5 5 5 5 0 0 0 5-5V3"></path><path d="M7 21v-3a5 5 0 0 1 5-5 5 5 0 0 1 5 5v3"></path></svg>
      </div>
      <h2 style="margin: 0; font-size: 22px; line-height: 28px; font-weight: 400">API の利用上限に達しました</h2>
      <p style="margin: 0; font-size: 14px; line-height: 20px; color: #49454F">サインインすると上限が 1 時間 5,000 回に増えます。サインインしない場合は [リセット時刻] 以降に再試行できます。</p>
      <div style="display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; justify-content: center">
        <button style="height: 40px; padding: 0 24px 0 16px; border: 0; border-radius: 20px; background: #6750A4; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 8px">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path><path d="M10 17l5-5-5-5"></path><path d="M15 12H3"></path></svg>
          GitHub にサインイン
        </button>
        <button style="height: 40px; padding: 0 24px; border: 1px solid #79747E; border-radius: 20px; background: transparent; color: #6750A4; font: inherit; font-size: 14px; font-weight: 500">再試行</button>
      </div>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1680,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var widths = [140, 110, 160, 120, 150, 100, 135, 125, 145];
    var skeletons = widths.map(function (w) {
      return { lineStyle: 'width: ' + w + 'px; height: 16px; border-radius: 8px; background: #E6E0E9' };
    });
    var tones = [['#EADDFF', '#21005D'], ['#E8DEF8', '#1D192B'], ['#FFD8E4', '#31111D']];
    var raw = [['ivey', 6], ['evanphx', 7], ['vanpelt', 17], ['wayneeseguin', 18], ['brynary', 19], ['kevinclark', 20], ['technoweenie', 21]];
    var users = raw.map(function (r, i) {
      var t = tones[i % 3];
      return {
        login: r[0],
        id: r[1],
        initial: r[0].charAt(0).toUpperCase(),
        avatarStyle: 'width: 48px; height: 48px; border-radius: 24px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 500; background: ' + t[0] + '; color: ' + t[1]
      };
    });
    return { skeletons: skeletons, users: users };
  }
}
</script>
</body>
</html>
