<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ユーザー一覧（スマホ）</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;family=Noto+Sans+JP:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
</style>
</helmet>
<div style="{{rootStyle}}">
  <header style="height: 64px; padding: 0 4px 0 16px; display: flex; align-items: center; gap: 8px; flex-shrink: 0">
    <h1 style="margin: 0; flex-grow: 1; font-size: 22px; line-height: 28px; font-weight: 400">GitHub Users</h1>
    <button aria-label="その他のオプション" aria-haspopup="menu" style="{{menuButtonStyle}}">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="5" r="1"></circle><circle cx="12" cy="12" r="1"></circle><circle cx="12" cy="19" r="1"></circle></svg>
    </button>
  </header>
  <div style="padding: 0 16px 12px; flex-shrink: 0">
    <label style="height: 56px; border-radius: 28px; background: var(--ch); display: flex; align-items: center; gap: 12px; padding: 0 16px; color: var(--osv)">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
      <input type="search" placeholder="ユーザー名で絞り込み" aria-label="ユーザー名で絞り込み" style="flex-grow: 1; border: 0; background: transparent; font: inherit; font-size: 16px; color: var(--os); outline: none; min-width: 0">
    </label>
  </div>
  <ul style="list-style: none; margin: 0; padding: 0; flex-grow: 1; overflow: hidden">
    <sc-for list="{{users}}" as="u" hint-placeholder-count="9">
      <li>
        <a href="PhoneDetail.dc.html" style="height: 72px; display: flex; align-items: center; gap: 16px; padding: 0 16px; color: var(--os)">
          <div style="{{u.avatarStyle}}">{{u.initial}}</div>
          <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 16px; line-height: 24px; font-weight: 500">{{u.login}}</span>
            <span style="font-size: 14px; line-height: 20px; color: var(--osv)">ID {{u.id}} · User</span>
          </div>
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: var(--osv)"><path d="M9 6l6 6-6 6"></path></svg>
        </a>
      </li>
    </sc-for>
  </ul>
  <div style="height: 56px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; gap: 12px; color: var(--osv); font-size: 14px; border-top: 1px solid var(--olv)">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="9" stroke="var(--sc2)" stroke-width="3"></circle><path d="M12 3a9 9 0 0 1 9 9" stroke="var(--p)" stroke-width="3" stroke-linecap="round"></path></svg>
    <span>さらに読み込み中…</span>
  </div>

  <sc-if value="{{menuSignedOut}}" hint-placeholder-val="{{ false }}">
    <ul role="menu" aria-label="その他のオプション" style="position: absolute; top: 56px; right: 12px; width: 240px; margin: 0; padding: 8px 0; list-style: none; border-radius: 4px; background: var(--c); box-shadow: 0 2px 6px 2px rgba(0,0,0,0.15), 0 1px 2px rgba(0,0,0,0.3)">
      <li role="none"><button role="menuitem" style="width: 100%; height: 48px; border: 0; background: transparent; padding: 0 12px; display: flex; align-items: center; gap: 12px; color: var(--os); font: inherit; font-size: 14px; font-weight: 500; text-align: left">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: var(--osv)"><path d="M21 12a9 9 0 1 1-3-6.7"></path><path d="M21 4v5h-5"></path></svg>再読み込み</button></li>
      <li role="none"><button role="menuitem" style="width: 100%; height: 48px; border: 0; background: transparent; padding: 0 12px; display: flex; align-items: center; gap: 12px; color: var(--os); font: inherit; font-size: 14px; font-weight: 500; text-align: left">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: var(--osv)"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path><path d="M10 17l5-5-5-5"></path><path d="M15 12H3"></path></svg>GitHub にサインイン</button></li>
    </ul>
  </sc-if>

  <sc-if value="{{menuSignedIn}}" hint-placeholder-val="{{ false }}">
    <ul role="menu" aria-label="その他のオプション" style="position: absolute; top: 56px; right: 12px; width: 264px; margin: 0; padding: 8px 0; list-style: none; border-radius: 4px; background: var(--c); box-shadow: 0 2px 6px 2px rgba(0,0,0,0.15), 0 1px 2px rgba(0,0,0,0.3)">
      <li role="none" aria-disabled="true" style="height: 48px; padding: 0 12px; display: flex; align-items: center; gap: 12px; color: var(--osv); font-size: 14px">
        <div aria-hidden="true" style="width: 24px; height: 24px; border-radius: 12px; flex-shrink: 0; background: var(--tc); color: var(--otc); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700">Y</div>
        <span>@your-login でサインイン中</span>
      </li>
      <li role="none"><button role="menuitem" style="width: 100%; height: 48px; border: 0; background: transparent; padding: 0 12px; display: flex; align-items: center; gap: 12px; color: var(--os); font: inherit; font-size: 14px; font-weight: 500; text-align: left">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: var(--osv)"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><path d="M16 17l5-5-5-5"></path><path d="M21 12H9"></path></svg>サインアウト</button></li>
      <li role="separator" style="height: 1px; margin: 8px 0; background: var(--olv)"></li>
      <li role="none"><button role="menuitem" style="width: 100%; height: 48px; border: 0; background: transparent; padding: 0 12px; display: flex; align-items: center; gap: 12px; color: var(--os); font: inherit; font-size: 14px; font-weight: 500; text-align: left">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: var(--osv)"><path d="M21 12a9 9 0 1 1-3-6.7"></path><path d="M21 4v5h-5"></path></svg>再読み込み</button></li>
    </ul>
  </sc-if>

  <sc-if value="{{signOutDialog}}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; inset: 0; background: rgba(0,0,0,0.32); display: flex; align-items: center; justify-content: center; padding: 0 39px">
      <div role="alertdialog" aria-labelledby="so-title" style="width: 100%; box-sizing: border-box; border-radius: 28px; background: var(--ch); padding: 24px; display: flex; flex-direction: column; gap: 16px">
        <h2 id="so-title" style="margin: 0; font-size: 24px; line-height: 32px; font-weight: 400; color: var(--os)">サインアウトしますか？</h2>
        <p style="margin: 0; font-size: 14px; line-height: 20px; color: var(--osv)">この端末に保存しているアクセストークンを削除します。</p>
        <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px">
          <button style="height: 40px; padding: 0 12px; border: 0; border-radius: 20px; background: transparent; color: var(--p); font: inherit; font-size: 14px; font-weight: 500">キャンセル</button>
          <button style="height: 40px; padding: 0 12px; border: 0; border-radius: 20px; background: transparent; color: var(--p); font: inherit; font-size: 14px; font-weight: 500">サインアウト</button>
        </div>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{hasSnack}}" hint-placeholder-val="{{ false }}">
    <div role="status" style="position: absolute; left: 16px; right: 16px; bottom: 16px; min-height: 48px; border-radius: 4px; background: var(--is); color: var(--ios); display: flex; align-items: center; gap: 8px; padding: 6px 8px 6px 16px; box-sizing: border-box; box-shadow: 0 2px 6px 2px rgba(0,0,0,0.15)">
      <span style="flex-grow: 1; font-size: 14px; line-height: 20px; padding: 8px 0">{{snackText}}</span>
      <sc-if value="{{snackAction}}" hint-placeholder-val="{{ true }}">
        <button style="height: 40px; padding: 0 12px; border: 0; background: transparent; color: var(--ip); font: inherit; font-size: 14px; font-weight: 500; flex-shrink: 0">{{snackAction}}</button>
      </sc-if>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"overlay":{"editor":"enum","options":["none","menuSignedOut","menuSignedIn","signOutDialog","snackSignedIn","snackSignedOut","snackRevoked"],"default":"none"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var overlay = this.props.overlay ?? 'none';
    var tones = [['--pc', '--opc'], ['--sc2', '--osc2'], ['--tc', '--otc']];
    var raw = [['mojombo', 1], ['defunkt', 2], ['pjhyett', 3], ['wycats', 4], ['ezmobius', 5], ['ivey', 6], ['evanphx', 7], ['vanpelt', 17], ['wayneeseguin', 18], ['brynary', 19]];
    var users = raw.map(function (r, i) {
      var t = tones[i % 3];
      return {
        login: r[0],
        id: r[1],
        initial: r[0].charAt(0).toUpperCase(),
        avatarStyle: 'width: 48px; height: 48px; border-radius: 24px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 500; background: var(' + t[0] + '); color: var(' + t[1] + ')'
      };
    });
    var snacks = {
      snackSignedIn: ['@your-login としてサインインしました', ''],
      snackSignedOut: ['サインアウトしました', 'GitHub の設定'],
      snackRevoked: ['GitHub のアクセス許可が無効になったため、サインアウトしました', 'サインイン']
    };
    var snack = snacks[overlay];
    var menuOpen = overlay === 'menuSignedOut' || overlay === 'menuSignedIn';
    var L = '--p:#6750A4;--op:#FFFFFF;--pc:#EADDFF;--opc:#21005D;--sc2:#E8DEF8;--osc2:#1D192B;--tc:#FFD8E4;--otc:#31111D;--s:#FEF7FF;--os:#1D1B20;--osv:#49454F;--ol:#79747E;--olv:#CAC4D0;--cl:#F7F2FA;--c:#F3EDF7;--ch:#ECE6F0;--chh:#E6E0E9;--is:#322F35;--ios:#F5EFF7;--ip:#D0BCFF;--ec:#F9DEDC;--oec:#8C1D18;';
    var D = '--p:#D0BCFF;--op:#381E72;--pc:#4F378B;--opc:#EADDFF;--sc2:#4A4458;--osc2:#E8DEF8;--tc:#633B48;--otc:#FFD8E4;--s:#141218;--os:#E6E0E9;--osv:#CAC4D0;--ol:#938F99;--olv:#49454F;--cl:#1D1B20;--c:#211F26;--ch:#2B2930;--chh:#36343B;--is:#E6E0E9;--ios:#322F35;--ip:#6750A4;--ec:#8C1D18;--oec:#F9DEDC;';
    var rootStyle = (this.props.dark ? D : L) + ' position: relative; width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: var(--s); color: var(--os); font-family: Roboto, \'Noto Sans JP\', sans-serif; overflow: hidden';
    return {
      users: users,
      rootStyle: rootStyle,
      menuButtonStyle: 'width: 48px; height: 48px; border: 0; border-radius: 24px; display: flex; align-items: center; justify-content: center; color: var(--osv); background: ' + (menuOpen ? 'var(--chh)' : 'transparent'),
      menuSignedOut: overlay === 'menuSignedOut',
      menuSignedIn: overlay === 'menuSignedIn',
      signOutDialog: overlay === 'signOutDialog',
      hasSnack: !!snack,
      snackText: snack ? snack[0] : '',
      snackAction: snack ? snack[1] : ''
    };
  }
}
</script>
</body>
</html>
