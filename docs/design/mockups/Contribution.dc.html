<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>コントリビューションのカレンダー</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;family=Noto+Sans+JP:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="{{rootStyle}}">
  <section aria-label="コントリビューション" style="{{cardStyle}}">

    <sc-if value="{{showGraph}}" hint-placeholder-val="{{ true }}">
      <div style="height: 20px; display: flex; align-items: center; gap: 12px">
        <sc-if value="{{loading}}" hint-placeholder-val="{{ false }}">
          <div style="width: 200px; height: 14px; border-radius: 7px; background: var(--chh)"></div>
          <div style="flex-grow: 1"></div>
          <div style="width: 56px; height: 14px; border-radius: 7px; background: var(--chh)"></div>
        </sc-if>
        <sc-if value="{{notLoading}}" hint-placeholder-val="{{ true }}">
          <h4 style="margin: 0; flex-grow: 1; font-size: 14px; line-height: 20px; font-weight: 500; color: var(--os)">過去1年間のコントリビューション</h4>
          <span style="font-size: 14px; line-height: 20px; font-weight: 500; color: var(--p)">{{totalText}}</span>
        </sc-if>
      </div>

      <div role="img" aria-label="{{summary}}" style="{{graphStyle}}">
        <div aria-hidden="true" style="width: 20px; flex-shrink: 0; position: relative">
          <sc-for list="{{weekdayLabels}}" as="w" hint-placeholder-count="3">
            <span style="{{w.style}}">{{w.text}}</span>
          </sc-for>
        </div>
        <div style="flex-grow: 1; min-width: 0; position: relative; overflow: hidden">
          <div style="{{innerStyle}}">
            <sc-for list="{{monthLabels}}" as="m" hint-placeholder-count="12">
              <span aria-hidden="true" style="{{m.style}}">{{m.text}}</span>
            </sc-for>
            <sc-for list="{{cells}}" as="c" hint-placeholder-count="371">
              <div onClick="{{c.pick}}" style="{{c.style}}"></div>
            </sc-for>
          </div>
          <sc-if value="{{scrolled}}" hint-placeholder-val="{{ true }}">
            <div aria-hidden="true" style="{{fadeStyle}}"></div>
          </sc-if>
        </div>
      </div>

      <div style="min-height: 16px; display: flex; align-items: center; gap: 12px">
        <span aria-live="polite" style="{{footTextStyle}}">{{footText}}</span>
        <sc-if value="{{showLegend}}" hint-placeholder-val="{{ true }}">
          <div aria-label="凡例：色が濃いほど件数が多い" style="display: flex; align-items: center; gap: 4px; flex-shrink: 0; font-size: 11px; line-height: 16px; font-weight: 500; color: var(--osv)">
            <span>少ない</span>
            <div style="display: flex; gap: 3px">
              <sc-for list="{{legend}}" as="l" hint-placeholder-count="5">
                <div style="{{l.style}}"></div>
              </sc-for>
            </div>
            <span>多い</span>
          </div>
        </sc-if>
      </div>
    </sc-if>

    <sc-if value="{{signedOut}}" hint-placeholder-val="{{ false }}">
      <div style="{{promptStyle}}">
        <div style="display: flex; gap: 16px; align-items: flex-start; flex-grow: 1; min-width: 0">
          <div style="width: 40px; height: 40px; border-radius: 20px; flex-shrink: 0; background: var(--pc); color: var(--opc); display: flex; align-items: center; justify-content: center">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="3" y="3" width="5" height="5" rx="1"></rect><rect x="9.5" y="3" width="5" height="5" rx="1" opacity=".55"></rect><rect x="16" y="3" width="5" height="5" rx="1" opacity=".3"></rect><rect x="3" y="9.5" width="5" height="5" rx="1" opacity=".3"></rect><rect x="9.5" y="9.5" width="5" height="5" rx="1"></rect><rect x="16" y="9.5" width="5" height="5" rx="1" opacity=".55"></rect><rect x="3" y="16" width="5" height="5" rx="1" opacity=".55"></rect><rect x="9.5" y="16" width="5" height="5" rx="1" opacity=".3"></rect><rect x="16" y="16" width="5" height="5" rx="1"></rect></svg>
          </div>
          <div style="display: flex; flex-direction: column; gap: 4px; min-width: 0">
            <h4 style="margin: 0; font-size: 14px; line-height: 20px; font-weight: 500">コントリビューションのカレンダー</h4>
            <p style="margin: 0; font-size: 14px; line-height: 20px; color: var(--osv)">サインインすると、コントリビューションのカレンダーを表示できます</p>
          </div>
        </div>
        <button style="height: 40px; padding: 0 24px 0 16px; border: 0; border-radius: 20px; background: var(--sc2); color: var(--osc2); font: inherit; font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 8px; flex-shrink: 0; align-self: {{btnAlign}}">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path><path d="M10 17l5-5-5-5"></path><path d="M15 12H3"></path></svg>
          GitHub にサインイン
        </button>
      </div>
    </sc-if>

    <sc-if value="{{error}}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; align-items: center; gap: 12px; min-height: 40px">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: var(--er); flex-shrink: 0"><circle cx="12" cy="12" r="9"></circle><path d="M12 7.5v5.5"></path><circle cx="12" cy="16.5" r=".6" fill="currentColor"></circle></svg>
        <p style="margin: 0; flex-grow: 1; font-size: 14px; line-height: 20px; color: var(--os)">コントリビューションを読み込めませんでした</p>
        <button style="height: 40px; padding: 0 12px; border: 0; border-radius: 20px; background: transparent; color: var(--p); font: inherit; font-size: 14px; font-weight: 500; flex-shrink: 0">再試行</button>
      </div>
    </sc-if>

  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"state":{"editor":"enum","options":["data","selected","empty","loading","signedOut","error","hidden"],"default":"data"},"layout":{"editor":"enum","options":["phone","tablet"],"default":"phone"},"dark":{"editor":"boolean","default":false},"$preview":{"width":358,"height":207}}'>
class Component extends DCLogic {
  renderVals() {
    var self = this;
    var st = this.props.state || 'data';
    var tablet = this.props.layout === 'tablet';
    var dark = !!this.props.dark;

    // --- 寸法（DESIGN.md「草」と同じ数値） ---
    var width = tablet ? 744 : 358;       // カードの外寸
    var pad = 16;
    var labelW = 20;                      // 曜日ラベルの列
    var viewportW = width - pad * 2 - labelW;
    var fitPitch = Math.floor(viewportW / 53);
    var fit = fitPitch >= 13;             // 13dp 以上で全体が収まるなら全体表示
    var pitch = fit ? fitPitch : 14;      // 横スクロールのときは マス11dp＋間隔3dp
    var gap = 3;
    var cell = Math.min(pitch - gap, 13);
    var monthH = 16, monthGap = 4;

    // --- ダミーデータ（過去1年間：2025-10-28〜2026-10-28） ---
    var DAY = 86400000;
    var start = Date.UTC(2025, 9, 28), end = Date.UTC(2026, 9, 28);
    var startWd = new Date(start).getUTCDay();
    var seed = 20261028;
    function rnd() { seed = (seed * 1103515245 + 12345) % 2147483648; return seed / 2147483648; }
    var days = [];
    for (var t = start, i = 0; t <= end; t += DAY, i++) {
      var d = new Date(t);
      var wd = d.getUTCDay();
      var m = d.getUTCMonth(), dd = d.getUTCDate();
      var weekend = wd === 0 || wd === 6;
      var holiday = (m === 11 && dd >= 27) || (m === 0 && dd <= 4) || (m === 7 && dd >= 10 && dd <= 16);
      var p0 = holiday ? 0.85 : (weekend ? 0.6 : 0.22);
      var n = rnd() < p0 ? 0 : 1 + Math.floor(Math.pow(rnd(), 2.2) * 14);
      if (m === 8 && dd === 17) n = 24;
      if (st === 'empty') n = 0;
      days.push({ t: t, y: d.getUTCFullYear(), m: m, d: dd, wd: wd, col: Math.floor((i + startWd) / 7), n: n });
    }
    var cols = days[days.length - 1].col + 1;

    // 四分位（実装では API の contributionLevel をそのまま使う）
    var nz = days.filter(function (x) { return x.n > 0; }).map(function (x) { return x.n; }).sort(function (a, b) { return a - b; });
    function q(p) { return nz.length ? nz[Math.floor((nz.length - 1) * p)] : 0; }
    var q1 = q(0.25), q2 = q(0.5), q3 = q(0.75);
    function level(n) { return n === 0 ? 0 : n <= q1 ? 1 : n <= q2 ? 2 : n <= q3 ? 3 : 4; }

    var cardVar = tablet ? 'var(--s)' : 'var(--cl)';
    var mix = [0, 30, 52, 76, 100];
    function color(l) {
      if (st === 'loading') return 'var(--chh)';
      if (l === 0) return 'var(--chh)';
      if (l === 4) return 'var(--p)';
      return 'color-mix(in srgb, var(--p) ' + mix[l] + '%, ' + cardVar + ')';
    }

    var WD = ['日', '月', '火', '水', '木', '金', '土'];
    function fmt(x) { return x.y + '/' + (x.m + 1) + '/' + x.d + '（' + WD[x.wd] + '）'; }
    function fmtLong(x) { return x.y + '年' + (x.m + 1) + '月' + x.d + '日'; }

    var total = days.reduce(function (s, x) { return s + x.n; }, 0);
    var max = days.reduce(function (a, x) { return x.n > a.n ? x : a; }, days[0]);

    var defaultSel = st === 'selected' ? '2026-8-17' : null;
    var selKey = (this.state && this.state.sel !== undefined) ? this.state.sel : defaultSel;
    var interactive = st === 'data' || st === 'selected';

    var cells = days.map(function (x) {
      var key = x.y + '-' + x.m + '-' + x.d;
      var on = interactive && key === selKey;
      return {
        style: 'position: absolute; left: ' + (x.col * pitch) + 'px; top: ' + (monthH + monthGap + x.wd * pitch) + 'px; width: ' + cell + 'px; height: ' + cell + 'px; border-radius: 2px; background: ' + color(level(x.n)) + (on ? '; box-shadow: 0 0 0 2px var(--os)' : '') + (interactive ? '; cursor: pointer' : ''),
        pick: function () { if (interactive) self.setState({ sel: on ? null : key }); }
      };
    });
    var sel = null;
    days.forEach(function (x) { if (interactive && x.y + '-' + x.m + '-' + x.d === selKey) sel = x; });

    // 月のラベル：列の最初の日の月が変わった列に置く。次のラベルまで3列未満なら省く
    var cand = [];
    var prev = -1;
    for (var c = 0; c < cols; c++) {
      var first = days.filter(function (x) { return x.col === c; })[0];
      if (first.m !== prev) { cand.push({ col: c, m: first.m }); prev = first.m; }
    }
    var monthLabels = [];
    cand.forEach(function (k, idx) {
      var next = cand[idx + 1];
      if (next && next.col - k.col < 3) return;
      monthLabels.push({ text: (k.m + 1) + '月', style: 'position: absolute; top: 0; left: ' + (k.col * pitch) + 'px; font-size: 11px; line-height: 16px; font-weight: 500; color: var(--osv); white-space: nowrap' + (st === 'loading' ? '; visibility: hidden' : '') });
    });

    var weekdayLabels = [1, 3, 5].map(function (r) {
      return { text: WD[r], style: 'position: absolute; left: 0; top: ' + (monthH + monthGap + r * pitch + (cell - 16) / 2) + 'px; font-size: 11px; line-height: 16px; font-weight: 500; color: var(--osv)' + (st === 'loading' ? '; visibility: hidden' : '') };
    });

    var gridW = cols * pitch - gap;
    var offset = fit ? 0 : -(gridW - viewportW);
    var graphH = monthH + monthGap + 7 * pitch - gap;

    var legend = [0, 1, 2, 3, 4].map(function (l) {
      return { style: 'width: ' + cell + 'px; height: ' + cell + 'px; border-radius: 2px; background: ' + color(l) };
    });

    var footText, footStrong = false;
    if (st === 'loading') footText = '';
    else if (st === 'empty') footText = '過去1年間のコントリビューションはありません';
    else if (sel) { footText = fmt(sel) + '  ' + sel.n.toLocaleString('en-US') + ' 件'; footStrong = true; }
    else footText = 'マスをタップすると件数を表示';

    var L = '--p:#6750A4;--op:#FFFFFF;--pc:#EADDFF;--opc:#21005D;--sc2:#E8DEF8;--osc2:#1D192B;--s:#FEF7FF;--os:#1D1B20;--osv:#49454F;--ol:#79747E;--olv:#CAC4D0;--cl:#F7F2FA;--c:#F3EDF7;--ch:#ECE6F0;--chh:#E6E0E9;--er:#B3261E;';
    var D = '--p:#D0BCFF;--op:#381E72;--pc:#4F378B;--opc:#EADDFF;--sc2:#4A4458;--osc2:#E8DEF8;--s:#141218;--os:#E6E0E9;--osv:#CAC4D0;--ol:#938F99;--olv:#49454F;--cl:#1D1B20;--c:#211F26;--ch:#2B2930;--chh:#36343B;--er:#F2B8B5;';

    var showGraph = st === 'data' || st === 'selected' || st === 'empty' || st === 'loading';
    var summary = st === 'loading' ? 'コントリビューションを読み込み中'
      : st === 'empty' ? '過去1年間のコントリビューションはありません'
      : '過去1年間のコントリビューション ' + total.toLocaleString('en-US') + ' 件。最も多い日は ' + fmtLong(max) + 'の ' + max.n + ' 件';

    return {
      rootStyle: (dark ? D : L) + ' width: ' + width + 'px; box-sizing: border-box; color: var(--os); font-family: Roboto, \'Noto Sans JP\', sans-serif',
      cardStyle: (st === 'hidden' ? 'display: none; ' : '') + 'border-radius: 16px; background: ' + cardVar + '; padding: ' + pad + 'px; display: flex; flex-direction: column; gap: 12px',
      showGraph: showGraph,
      loading: st === 'loading',
      notLoading: st !== 'loading',
      totalText: total.toLocaleString('en-US') + ' 件',
      summary: summary,
      graphStyle: 'display: flex; height: ' + graphH + 'px',
      btnAlign: tablet ? 'center' : 'flex-end',
      weekdayLabels: weekdayLabels,
      monthLabels: monthLabels,
      cells: cells,
      innerStyle: 'position: absolute; top: 0; left: ' + offset + 'px; width: ' + gridW + 'px; height: ' + graphH + 'px',
      scrolled: !fit,
      fadeStyle: 'position: absolute; top: 0; left: 0; width: 24px; height: 100%; background: linear-gradient(to right, ' + cardVar + ', transparent); pointer-events: none',
      footText: footText,
      footTextStyle: 'flex-grow: 1; min-width: 0; font-size: 12px; line-height: 16px; ' + (footStrong ? 'color: var(--os); font-weight: 500' : 'color: var(--osv)'),
      showLegend: st === 'data' || st === 'selected',
      legend: legend,
      signedOut: st === 'signedOut',
      error: st === 'error',
      promptStyle: 'display: flex; gap: 16px; ' + (tablet ? 'align-items: center' : 'flex-direction: column')
    };
  }
}
</script>
</body>
</html>
