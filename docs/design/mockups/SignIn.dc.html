<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>GitHub にサインイン</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;family=Roboto+Mono:wght@500&amp;family=Noto+Sans+JP:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="{{rootStyle}}">
  <sc-if value="{{isDialog}}" hint-placeholder-val="{{ false }}">
    <div aria-hidden="true" style="position: absolute; inset: 0">
      <dc-import name="TabletListDetail" selected="{{no}}" dark="{{dark}}" hint-size="1280px,800px"></dc-import>
    </div>
    <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(0,0,0,0.32)"></div>
  </sc-if>

  <div role="{{panelRole}}" aria-labelledby="si-title" style="{{panelStyle}}">
    <sc-if value="{{isScreen}}" hint-placeholder-val="{{ true }}">
      <header style="height: 64px; padding: 0 4px; display: flex; align-items: center; gap: 4px; flex-shrink: 0">
        <button aria-label="閉じる" style="width: 48px; height: 48px; border: 0; border-radius: 24px; background: transparent; color: var(--os); display: flex; align-items: center; justify-content: center">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
        </button>
        <h1 id="si-title" style="margin: 0; font-size: 22px; line-height: 28px; font-weight: 400">GitHub にサインイン</h1>
      </header>
    </sc-if>
    <sc-if value="{{isDialog}}" hint-placeholder-val="{{ false }}">
      <header style="padding: 16px 12px 0 24px; display: flex; align-items: center; gap: 8px; flex-shrink: 0">
        <h1 id="si-title" style="margin: 0; flex-grow: 1; font-size: 24px; line-height: 32px; font-weight: 400">GitHub にサインイン</h1>
        <button aria-label="閉じる" style="width: 48px; height: 48px; border: 0; border-radius: 24px; background: transparent; color: var(--osv); display: flex; align-items: center; justify-content: center">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
        </button>
      </header>
    </sc-if>

    <div style="{{bodyStyle}}">
      <sc-if value="{{showCode}}" hint-placeholder-val="{{ true }}">
        <p style="margin: 0; font-size: 16px; line-height: 24px">GitHub のページで次のコードを入力して、アクセスを許可してください。</p>

        <div style="position: relative; height: 96px; border-radius: 16px; background: var(--chh); display: flex; align-items: center; justify-content: center">
          <sc-if value="{{isLoading}}" hint-placeholder-val="{{ false }}">
            <div aria-label="コードを取得中" style="display: flex; gap: 12px; align-items: center">
              <div style="width: 96px; height: 28px; border-radius: 8px; background: var(--ch)"></div>
              <div style="width: 12px; height: 4px; border-radius: 2px; background: var(--ch)"></div>
              <div style="width: 96px; height: 28px; border-radius: 8px; background: var(--ch)"></div>
            </div>
          </sc-if>
          <sc-if value="{{isWaiting}}" hint-placeholder-val="{{ true }}">
            <span aria-label="W D J B ハイフン M J H T" style="font-family: 'Roboto Mono', monospace; font-size: 36px; line-height: 44px; font-weight: 500; letter-spacing: 2px">WDJB-MJHT</span>
          </sc-if>
          <button aria-label="コードをコピー" style="{{copyStyle}}">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"></rect><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"></path></svg>
          </button>
        </div>

        <button style="{{openButtonStyle}}">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6"></path><path d="M20 4l-9 9"></path><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"></path></svg>
          GitHub を開く
        </button>

        <p style="margin: 0; font-size: 14px; line-height: 20px; color: var(--osv)">パソコンなど別の端末で github.com/login/device を開いて入力することもできます</p>

        <sc-if value="{{isWaiting}}" hint-placeholder-val="{{ true }}">
          <div role="status" style="border-radius: 16px; background: var(--cl); padding: 12px 16px; display: flex; align-items: center; gap: 12px">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="flex-shrink: 0"><circle cx="12" cy="12" r="9" stroke="var(--sc2)" stroke-width="3"></circle><path d="M12 3a9 9 0 0 1 9 9" stroke="var(--p)" stroke-width="3" stroke-linecap="round"></path></svg>
            <div style="display: flex; flex-direction: column; gap: 2px">
              <span style="font-size: 14px; line-height: 20px">許可されるのを待っています…</span>
              <span style="font-size: 12px; line-height: 16px; color: var(--osv)">コードの有効期限：あと 14 分</span>
            </div>
          </div>
        </sc-if>
      </sc-if>

      <sc-if value="{{showStatus}}" hint-placeholder-val="{{ false }}">
        <div role="status" style="display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center; padding: 24px 8px 8px">
          <div style="{{statusIconStyle}}">
            <sc-if value="{{isExpired}}" hint-placeholder-val="{{ false }}">
              <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="8"></circle><path d="M12 9v4l2.5 2.5M9 2h6"></path></svg>
            </sc-if>
            <sc-if value="{{isDenied}}" hint-placeholder-val="{{ false }}">
              <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M5.6 5.6l12.8 12.8"></path></svg>
            </sc-if>
            <sc-if value="{{isError}}" hint-placeholder-val="{{ false }}">
              <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 8.5a15 15 0 0 1 20 0"></path><path d="M5 12a10 10 0 0 1 9-2.6"></path><path d="M8.5 15.5a5 5 0 0 1 4-1.3"></path><path d="M3 3l18 18"></path><circle cx="12" cy="19" r="1"></circle></svg>
            </sc-if>
          </div>
          <h2 style="margin: 0; font-size: 22px; line-height: 28px; font-weight: 400">{{statusTitle}}</h2>
          <p style="margin: 0; font-size: 14px; line-height: 20px; color: var(--osv)">{{statusBody}}</p>
          <button style="height: 40px; padding: 0 24px; border: 0; border-radius: 20px; background: var(--p); color: var(--op); font: inherit; font-size: 14px; font-weight: 500; margin-top: 8px">{{statusButton}}</button>
        </div>
      </sc-if>

      <p style="{{noteStyle}}">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 1px"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
        <span>このアプリが受け取るのは公開情報の読み取り権限だけです。</span>
      </p>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"state":{"editor":"enum","options":["loading","waiting","expired","denied","error"],"default":"waiting"},"layout":{"editor":"enum","options":["screen","dialog"],"default":"screen"},"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var state = this.props.state ?? 'waiting';
    var dialog = (this.props.layout ?? 'screen') === 'dialog';
    var dark = !!this.props.dark;
    var L = '--p:#6750A4;--op:#FFFFFF;--pc:#EADDFF;--opc:#21005D;--sc2:#E8DEF8;--osc2:#1D192B;--tc:#FFD8E4;--otc:#31111D;--s:#FEF7FF;--os:#1D1B20;--osv:#49454F;--ol:#79747E;--olv:#CAC4D0;--cl:#F7F2FA;--c:#F3EDF7;--ch:#ECE6F0;--chh:#E6E0E9;--ec:#F9DEDC;--oec:#8C1D18;--dis:rgba(29,27,32,0.12);--odis:rgba(29,27,32,0.38);';
    var D = '--p:#D0BCFF;--op:#381E72;--pc:#4F378B;--opc:#EADDFF;--sc2:#4A4458;--osc2:#E8DEF8;--tc:#633B48;--otc:#FFD8E4;--s:#141218;--os:#E6E0E9;--osv:#CAC4D0;--ol:#938F99;--olv:#49454F;--cl:#1D1B20;--c:#211F26;--ch:#2B2930;--chh:#36343B;--ec:#8C1D18;--oec:#F9DEDC;--dis:rgba(230,224,233,0.12);--odis:rgba(230,224,233,0.38);';
    var font = 'font-family: Roboto, \'Noto Sans JP\', sans-serif;';
    var rootStyle = (dark ? D : L) + font + ' position: relative; box-sizing: border-box; overflow: hidden; color: var(--os); ' +
      (dialog ? 'width: 1280px; height: 800px;' : 'width: 390px; height: 844px; background: var(--s);');
    var panelStyle = dialog
      ? 'position: absolute; left: 360px; top: 120px; width: 560px; box-sizing: border-box; border-radius: 28px; background: var(--ch); display: flex; flex-direction: column; box-shadow: 0 4px 8px 3px rgba(0,0,0,0.15), 0 1px 3px rgba(0,0,0,0.3)'
      : 'width: 100%; height: 100%; display: flex; flex-direction: column';
    var bodyStyle = 'display: flex; flex-direction: column; gap: 20px; ' + (dialog ? 'padding: 16px 24px 24px;' : 'padding: 8px 24px 24px; flex-grow: 1;');
    var loading = state === 'loading';
    var statuses = {
      expired: ['コードの有効期限が切れました', 'もう一度コードを取得して、最初からやり直してください。', '新しいコードを取得', false],
      denied: ['アクセスが許可されませんでした', 'GitHub のページでアクセスが拒否されました。', 'もう一度試す', false],
      error: ['コードを取得できませんでした', 'ネットワーク接続を確認して、もう一度お試しください。', '再試行', true]
    };
    var st = statuses[state];
    return {
      no: false,
      dark: dark,
      rootStyle: rootStyle,
      panelStyle: panelStyle,
      panelRole: dialog ? 'dialog' : 'main',
      bodyStyle: bodyStyle,
      isDialog: dialog,
      isScreen: !dialog,
      showCode: !st,
      showStatus: !!st,
      isLoading: loading,
      isWaiting: state === 'waiting',
      isExpired: state === 'expired',
      isDenied: state === 'denied',
      isError: state === 'error',
      statusTitle: st ? st[0] : '',
      statusBody: st ? st[1] : '',
      statusButton: st ? st[2] : '',
      statusIconStyle: 'width: 80px; height: 80px; border-radius: 40px; display: flex; align-items: center; justify-content: center; ' + (st && st[3] ? 'background: var(--ec); color: var(--oec)' : 'background: var(--chh); color: var(--osv)'),
      copyStyle: 'position: absolute; right: 8px; top: 24px; width: 48px; height: 48px; border: 0; border-radius: 24px; background: transparent; display: flex; align-items: center; justify-content: center; color: ' + (loading ? 'var(--odis)' : 'var(--osv)'),
      openButtonStyle: 'height: 48px; width: 100%; border: 0; border-radius: 24px; font: inherit; font-size: 14px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 8px; ' + (loading ? 'background: var(--dis); color: var(--odis)' : 'background: var(--p); color: var(--op)'),
      noteStyle: 'margin: ' + (dialog ? '0' : 'auto 0 0') + '; display: flex; gap: 8px; font-size: 12px; line-height: 16px; color: var(--osv)'
    };
  }
}
</script>
</body>
</html>
